slug: v5-hoc
name: V5 / Học (TNE) — trang chủ trangnguyen.edu.vn
aliases: [tne5, v5]
verified: true
architecture: monolith   # BE gộp; FE tách theo mặt tiền
origin: outsource        # đối tác viết → BCN maintain sau bàn giao
role: hub                # trang chủ trangnguyen.edu.vn → điều hướng sang v6 và v2

techstack:
  source: devops/tnv/tnv-troubleshoot-helper
  overview: systems/tne5/OVERVIEW.md
  snapshot: "2026-08-24 · user pipes 2026-09-07"
  scope: "7 app ArgoCD tne5. Dev hostname lẫn stag-v3 và dev-v3. IAM + 4 ống user: catalog/products/kc-identity.yaml."

# 7 thành phần ArgoCD (verify từ tne5-argocd-manifest + troubleshoot-helper)
gitlab:
  source_group: tne5
  hostname_note: "dev dùng lẫn stag-v3 (web) và *.dev-v3 (admin/iam); api ăn cả hai"
  components:
    - app: api
      kind: BE
      repo: tne5/backend/v5
      image: tne5/backend/v5
      lang: Node.js
      framework: "monolith (Bull queue + KafkaJS suy từ env; framework chưa confirm ops)"
      port: 8000
      health: GET /healthz
      host: "api.stag-v3 / api.dev-v3"
      payment_ipn: "payment.stag-v3 / payment.dev-v3 path /v5/payments/ipn/vnpay"
      deps: "Yugabyte, Redis Sentinel, Kafka, ES, ClickHouse, Mongo, MinIO"
      note: "giữ master data trường/huyện/tỉnh, cấp REST cho V khác"
    - app: cdc
      kind: worker
      repo: tne5/backend/v5
      image: tne5/backend/v5
      lang: Node.js
      note: "chung image với api; Mongo change stream → IAM updateUser. KHÔNG phải Vector sync. cdc_logs SUCCESS ≠ user đã có trên V5. Chi tiết: kc-identity.yaml pipes.cdc_mongo_to_iam"
    - app: web
      kind: FE
      repo: tne5/frontend/v5
      image: tne5/frontend/v5
      lang: Node.js
      framework: "SSR :3000 (Next/Nuxt chưa confirm ops)"
      port: 3000
      host: stag-v3
      deps: "api, IAM iam.dev-v3 realm tnv-main, Redis Sentinel"
      desc: "Web tin tức (user)"
    - app: admin
      kind: FE
      repo: tne5/frontend/admin-v5
      image: tne5/frontend/admin-v5
      framework: "SPA tĩnh (framework chưa confirm ops)"
      port: 80
      host: admin.dev-v3
      desc: "CMS tin tức (admin); config API nhiều khả năng bake vào build"
    - app: iam
      kind: iam
      repo: tne5/frontend/v5-identity
      image: tne5/frontend/v5-identity
      framework: Keycloak 26.2.3
      port: 8080
      management_port: 9000
      dest_namespace: tne5-dev   # không phải tn-dev
      argocd_app: tne5-iam-dev
      workload: iam-dev
      host: iam.dev-v3
      realm: [tnv-main, tnv-noi-bo, tnv-quantri, tnmath-admin]
      db: "keycloak_dev @ 192.168.80.35:30432 (CNPG cụm cũ)"
      cache: "KC_CACHE=local (không cluster)"
      bcrypt: false
      see: catalog/products/kc-identity.yaml
      staging: "không có app IAM STAG; V2/V5 staging auth tne5-dev-iam (host iam.dev-v3)"
    - app: pipe
      kind: worker
      image: timberio/vector
      framework: Vector
      note: "Kafka → ClickHouse (learning log); config trong manifest, không repo app"
    - app: sync
      kind: worker
      image: timberio/vector
      framework: Vector
      note: "Vector: Kafka topic user_info → Elasticsearch (search only). KHÔNG đụng IAM/Mongo. Thiếu user trên ES → đây; lệch login/profile → webhook api + cdc, không app này."
  gitops:
    dev:
      path: tne5/devops/tne5-argocd-manifest
      values: values-dev.yaml
      note: "nginx ingress; workload api/web/admin ns tn-dev; iam ns tne5-dev"
    config:
      id: 166
      path: devops/tnv/tne5-argocd-config
  common_chart: devops/common-chart   # fork bjw-s common 4.6.2

master_data:
  owner: v5
  entities: [trường, huyện, tỉnh]
  exposed_via: REST API
  consumers: [v2, v6]
  note: "Sửa schema master data ở V5 → cân nhắc consumer V2/V6."

stack:
  primary_db: "YugabyteDB 192.168.80.39:5433 db trangnguyen_dev — bảng user = profile V5 (id UUID, keycloak_user_id, idv0). KHÔNG phải DB Keycloak (keycloak_dev @ .80.35)."
  cache: "Redis Sentinel .80.39-40"
  messaging: "Kafka .80.48-50"
  search: "Elasticsearch .80.45-47"
  analytics: "ClickHouse .80.56"
  document: "MongoDB .60.21-24 (dùng chung)"
  legacy_cluster: ".80.35 (Directus/Gotenberg/PG-Keycloak)"

# Quan hệ FE V2 ↔ V5: KHÔNG chung codebase. 2 repo/2 domain, chỉ giống layout.
fe_relationship:
  v5_fe: tne5/frontend/v5
  v5_domain_prod: trangnguyen.edu.vn
  v2_fe: tne5/frontend/exam-page
  v2_domain_prod: thi.trangnguyen.edu.vn
  cross_nav: "click menu V2 khi ở V5 → thi.trangnguyen.edu.vn; menu V5 khi ở V2 → trangnguyen.edu.vn"
  note: "Sửa layout/menu 1 bên → đồng bộ visual parity + link chéo bên kia, nhưng build/deploy độc lập."

platform:
  DEV:
    project_id: 8
    name: tne5-dev
    namespace: tn-dev
    argocd_project: tne5-dev
  STAG: null
  PROD: null   # chưa tài liệu hóa

