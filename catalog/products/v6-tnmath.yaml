slug: v6-tnmath
name: V6 / TNMath
aliases: [tnmath, v6]
verified: true
architecture: micro-service   # NestJS + Python, realtime MQTT/EMQX
origin: outsource             # source gốc tinhvan → mirror group tnmath

gitlab:
  source_group: tnmath
  default_branch: develop      # trừ frontend-arena=main, arena-mqtt-service=pre-uat-tne
  services_be:
    - user-service
    - payment-service
    - media-service
    - game-service
    - game-mqtt-service
    - cms-service              # app ArgoCD: learning-service (tên lệch)
    - business-service
    - consumption-service
    - cronjob-service
    - arena-service
    - arena-mqtt-service       # branch pre-uat-tne
    - scorecard-recommendation # app ArgoCD: scorecard-service (tên lệch)
  services_fe:
    - frontend-math-website
    - frontend-math-admin
    - frontend-collab          # app ArgoCD: math-collab (tên lệch)
    - frontend-arena           # branch main
  name_mismatch:
    learning-service: cms-service
    scorecard-service: scorecard-recommendation
    math-collab: frontend-collab
  gitops: null   # cần map khi onboard

stack:
  gateway: APISIX (api/admin/website)
  realtime: "MQTT / EMQX .140.71-73"
  primary_db: "PostgreSQL .140.34:5433"
  document: "MongoDB .140.61-63"
  cache: "Redis .140.41-43"
  messaging: "Kafka .140.81-83"
  search: "Elasticsearch .140.52"
  object_storage: "MinIO .140.51:9002"
  clusters: "pre-UAT cluster-dev .140.x · prod 10.80.0.x"
  hotspot: "Realtime & loadtest là điểm nóng"

iam:
  central: "auth vào IAM tne5 (v5-identity), prod host id.trangnguyen.edu.vn, realm tne-main"

platform:
  DEV: null    # chưa onboard Platform
  STAG: null
  PROD: null

ops_docs:
  repo: devops/tnv/tnv-troubleshoot-helper
  overview: systems/tnmath/OVERVIEW.md
  notes: notes/tnmath.md
  runbooks:
    - runbooks/tnmath-preuat-loadtest-timeout.md

