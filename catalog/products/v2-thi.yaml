slug: v2-thi
name: V2 / Thi (TNE) — Trạng Nguyên Tiếng Việt
aliases: [tnv, v2]
verified: true
architecture: micro-service
origin: outsource   # đối tác viết → BCN maintain sau bàn giao

# FE Thi dùng chung group tne5/frontend nhưng KHÔNG chung codebase với V5:
# 2 repo/2 domain, chỉ giống layout; v5 là hub điều hướng sang v2.
frontend:
  image: tne5/frontend/exam-page   # app hoc-thi-2 (FE mới), tag staging tại dev
  legacy_app: hoc-thi              # FE cũ
  domain_prod: thi.trangnguyen.edu.vn
  domain_dev: [thi-stag-v3.trangnguyen.edu.vn, me-dev]

stack:
  primary_db: MongoDB
  messaging_high_load: Kafka        # thi online tải lớn ~500.000 CCU
  background_tasks: RabbitMQ
  object_storage: MinIO
  session_store: Redis              # V2 quản lý session trong Redis
  note: "Nghẽn thi online thường ở Kafka/consumer (throughput), không phải API stateless."

# Tech stack từng service (group tnv + exam-page). Không gồm bancn/Noibo.
# IP datastore: infra:. Env/Vault sống: ops_docs.overview.
techstack:
  source: devops/tnv/tnv-troubleshoot-helper
  overview: systems/tnv/OVERVIEW.md
  snapshot: 2026-08-24
  scope: "GitLab group tnv + tne5/frontend/exam-page (hoc-thi-2). Không ghi khaosat-fe / bcn-cms / bcn-tnv2-api / support-tnv2-*."

gitlab:
  source_group: tnv
  # tnv2-learn-exam-v2 là MONOREPO → build nhiều image (1 repo, nhiều workload)
  monorepo:
    repo: tnv/tnv2-learn-exam-v2   # id 52, develop
    lang: Java
    framework: Spring Boot
    build: Maven multi-module
    port: 8080
    auth: "IAM tne5, host iam.dev-v3, realm tnv-main"
    deps: "Mongo + Redis cluster + Kafka; RabbitMQ chỉ exam-api + 3 worker (learn-api/student-api không dùng)"
    sentry_project: 13
    services:
      - app: tnv2-learn-exam-api-v2
        kind: BE
        image: tnv/tnv2-learn-exam-v2/tnv-exam-api
        service_env: exam-api
        host: api-me-dev/exam
        rabbitmq: true
      - app: tnv2-learn-api-v2
        kind: BE
        image: tnv/tnv2-learn-exam-v2/tnv-learn-api
        service_env: learn-api
        host: api-me-dev/learning
        rabbitmq: false
      - app: tnv2-student-api-v2
        kind: BE
        image: tnv/tnv2-learn-exam-v2/tnv-student-api
        service_env: student-api
        host: api-me-dev/student
        rabbitmq: false
      - app: tnv2-learn-exam-consumer-v2
        kind: worker
        image: tnv/tnv2-learn-exam-v2/tnv-consumer
        service_env: consumer
        rabbitmq: true
      - app: tnv2-learn-exam-consumer-sync-data-v2
        kind: worker
        image: tnv/tnv2-learn-exam-v2/tnv-consumer-sync-data
        service_env: consumer-sync-data
        note: SYNC user
        rabbitmq: true
      - app: tnv2-learn-exam-schedule-v2
        kind: worker
        image: tnv/tnv2-learn-exam-v2/tnv-scheduler
        service_env: scheduler
        rabbitmq: true
  standalone_services:
    - app: tnv-service
      kind: BE
      repo: tnv/tnv-service
      lang: Python
      framework: FastAPI
      runtime: gunicorn + Celery
      port: 5000
      host: api-dev
      deps: "Mongo, Redis session, Kafka, RabbitMQ, ES, MinIO"
      auth: "dev: iam-dev realm tnv; staging: iam.dev-v3 realm tnv-main (IAM tne5)"
      sentry_project: 4
    - app: tnv2-learn-exam
      kind: BE
      note: legacy, cùng domain api-me-* với v2 (path /reports dev, /close stag)
      lang: Python
      framework: FastAPI
      port: 5001
      sentry_project: 3
    - app: api-cms-service
      kind: BE
      repo: tnv/cms-trang-nguyen-api   # tên lệch
      lang: Python
      framework: FastAPI + Celery
      port: 5000
      host: dev-api-cms2
      note: api + background + cronjob
    - app: quantri-trang-nguyen-api
      kind: BE
      repo: tnv/quantri-trang-nguyen-api
      lang: Python
      framework: FastAPI + Celery
      port: 5000
      host: api-dev-quantri
    - app: tnv-background-service
      kind: worker
      lang: Python
      framework: worker (no HTTP port)
      note: chủ yếu STAG, không HTTPRoute
    - app: consumer-service
      kind: worker
      repo: tnv/api-payment
      image: tnv/api-payment/comsumers   # typo comsumers
      lang: Java
      framework: Spring Boot
      port: 8080
      note: legacy payment consumer; API payment chính chưa bật trên cụm mới
    - app: kafka-connect
      kind: infra
      repo: tnv/kafka-connect-cdc   # tên lệch
      lang: Java
      framework: Kafka Connect CDC
      port: 8083
    - app: keycloak
      kind: iam
      repo: tnv/keycloak
      argocd_app: keycloak   # catalog cũ: keycloak-cluster
      framework: Keycloak 26.7.1 (operator CR)
      host: iam-dev
      realm: tnv
      note: KC v2 cũ; cms/quantri. Tag prod từng thấy ở dev — phân biệt IAM tne5 theo HOST
    - app: media-server
      kind: BE
      repo: tnv/media-server
      lang: Go
      port: 3000
      note: ngoại lệ — dùng Service redis nội bộ k8s (không đi HAProxy)
    - app: filestash
      kind: infra
      framework: Filestash + OnlyOffice (image public)
      host: file-dev
    - app: akhq-kafka-management
      kind: infra
      framework: AKHQ
      port: 8080
      host: akhq-dev
      note: UI Kafka, chủ yếu DEV
    - app: cms-landing
      kind: FE
      framework: Strapi
      status: disabled   # values _disable
  frontend_services:
    - app: hoc-thi
      kind: FE
      lang: JavaScript
      framework: Next.js 13
      port: 3000
      host: me-dev
      note: FE Thi cũ
    - app: hoc-thi-2
      kind: FE
      repo: tne5/frontend/exam-page
      image: tne5/frontend/exam-page
      lang: JavaScript
      framework: Next.js
      port: 3000
      host: thi-stag-v3
      note: FE Thi mới — không chung codebase V5
    - app: cms-admin
      kind: FE
      repo: tnv/cms-admin
      lang: JavaScript
      framework: React + Vite
      runtime: nginx
      port: 80
      host: dev-cms2
    - app: quantri-cms-admin
      kind: FE
      repo: tnv/quantri-cms-admin
      lang: JavaScript
      framework: React + Vite
      runtime: nginx
      port: 80
      host: dev-quantri
    - app: landing-trang-nguyen
      kind: FE
      lang: JavaScript
      framework: Next.js 13
      port: 3000
      host: dev-portal
    - app: landing-tieng-viet
      kind: FE
      lang: JavaScript
      framework: Next.js 13
      port: 3000
    - app: landing-toan-tai
      kind: FE
      lang: JavaScript
      framework: Next.js 13
      port: 3000
  gitops:
    dev_staging:
      id: 159
      path: devops/tnv/tnv-argocd-config
      branches: [dev, staging]
      note: "Gateway API + Vault ExternalSecret; cụm cluster-dev-tnv"
    prod:
      path: tnv/devops/tnv-argocd-manifest
      branch: tnv/prod
      note: "PROD chạy repo CŨ (44 app). Tag thật = tnv-services/<app>/.argocd-source-<app>-prod.yaml. KHÔNG dùng tnv-argocd-config cho prod."
    legacy_manifest:
      path: tnv/devops/tnv-argocd-manifest
      dead_branches: [tnv/dev, tnv/staging]
      note: "Chỉ tra env cũ (ConfigMap chứa secret plaintext — chỉ đọc)."

# Tag đang chạy thật = file .argocd-source-*.yaml, KHÔNG phải tag pin trong values.yaml.
runtime_note: >
  app→app KHÔNG gọi Service nội bộ k8s: đi vòng qua domain public → HAProxy 192.168.60.6
  → quay lại cụm (hostAliases). Domain không có trong HAProxy map bị silent-drop.

platform:
  DEV:
    project_id: 4
    name: tnv-dev
    namespace: tnv-dev
    argocd_project: tnv-dev
  STAG:
    project_id: 5
    name: tnv-staging
    namespace: tnv-staging
    argocd_project: tnv-staging
  PROD: null   # chưa onboard Platform; chạy trên tnv-argocd-manifest nhánh tnv/prod

infra:
  cluster_dev: "cluster-dev-tnv (RKE2) master 192.168.60.141, worker .144-146"
  gateway: "rke2-traefik Gateway API :8012 sau HAProxy 192.168.60.6"
  datastores: "Mongo .60.21-24 · Redis .60.21-23 · Kafka .60.31/32/44 · RabbitMQ .60.26 · PG .60.25:9999 · ES 10.0.0.207 · ClickHouse 10.0.0.58 · MinIO"
  sentry: "sentry.trangnguyen.edu.vn — tnv-service=proj4, tnv2-learn-exam=3, tnv2-learn-exam-v2=13"

iam:
  central: "IAM tne5 (v5-identity), host iam.dev-v3, realm tnv-main — form STAG + tnv-service staging auth vào đây. Không có app IAM STAG riêng (dùng tne5-dev-iam)."
  kc_v2_old: "tnv/keycloak, host iam-dev, realm tnv, DB keycloak_dev2@192.168.60.25:9999 — tnv-service DEV + cms/quantri"
  user_pipes: "4 ống tách (webhook api ≠ CDC ≠ Vector sync ≠ federation) — catalog/products/kc-identity.yaml. Mongo tnv_staging.users = hồ sơ V2; CDC bỏ qua source:new."

ops_docs:
  repo: devops/tnv/tnv-troubleshoot-helper
  overview: systems/tnv/OVERVIEW.md
  notes: notes/tnv.md
  services: systems/tnv/services/

apps_sample:
  - tnv-dev-hoc-thi-2
  - tnv-dev-tnv2-learn-exam-api-v2
  - tnv-staging-hoc-thi-2

# Clone folders (shared.clone_root + <group>-<repo>; git clone default có thể trùng tên → dùng tên có group)
local_clone_placeholder: C:\TungVu\OnlineStorage\OneDrive - Cong ty TNHH Dau tu Giao duc Trang Nguyen\source_code\tnv2-learn-exam-v2   # BE monorepo (dev-feature BE)
fe_clone_placeholder: C:\TungVu\OnlineStorage\OneDrive - Cong ty TNHH Dau tu Giao duc Trang Nguyen\source_code\tne5-frontend-exam-page  # FE Thi (parity workspace tne-v2-v5)
planka:
  project_name: Trạng Nguyên V2
